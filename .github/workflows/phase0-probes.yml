# Phase 0: run the access probes from a GitHub-hosted runner (US IP) so we can
# compare reachability with the laptop run. Results are committed to
# notebooks/phase0/results/gha/.
name: phase0-probes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "notebooks/phase0/probe_*.py"
      - "notebooks/phase0/_probe.py"
      - ".github/workflows/phase0-probes.yml"

permissions:
  contents: write

concurrency:
  group: phase0-probes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run probes (each may fail; all are recorded)
        working-directory: notebooks/phase0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for s in ingres enso idm imd wris; do
            python probe_$s.py || echo "probe $s failed"
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/phase0/results/gha/
          git diff --cached --quiet || git commit -m "Phase 0 probe results from GitHub Actions [skip ci]"
          git pull --rebase && git push
