<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>India Drought & Groundwater Watch</title>
  <meta name="description" content="District-level view of rain, groundwater and drought across India: where rain looks normal but groundwater is running low.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-head">
    <div class="brand">
      <h1 data-i18n="site_title">India Drought & Groundwater Watch</h1>
      <p data-i18n="tagline"></p>
      <p class="gap" data-i18n="tagline_gap"></p>
    </div>
    <nav class="view-tabs" aria-label="Views">
      <button id="nav-map" aria-pressed="true" data-i18n="nav_map">Map</button>
      <button id="nav-table" aria-pressed="false" data-i18n="nav_table">Table</button>
    </nav>
    <nav class="site-nav">
      <a href="methods.html" data-i18n="nav_methods">Methods</a>
      <button id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </nav>
  </header>

  <div class="controls" id="controls" role="search">
    <label><span data-i18n="ctl_layer">Show</span>
      <select id="layer"></select>
    </label>
    <div class="col-groups" id="col-groups"></div>
    <label><span data-i18n="ctl_date">Date</span>
      <select id="date"></select>
    </label>
    <label><span data-i18n="ctl_search">Find a district</span>
      <input id="search" list="district-list" autocomplete="off">
      <datalist id="district-list"></datalist>
    </label>
    <div class="asof" id="asof"></div>
    <details class="col-help" id="ctl-help"></details>
  </div>

  <main id="map-view" class="layout">
    <div class="map-wrap" id="map-wrap">
      <svg id="map" role="img" aria-label="Map of India's districts"></svg>
      <div class="tooltip" id="tooltip" role="status"></div>
      <div class="zoom-ctl" id="zoom-ctl">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="zoom-reset">⟲</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <section id="table-view" class="table-view" hidden>
    <div class="table-tools" id="table-tools"></div>
    <div class="table-scroll"><table class="data" id="table"></table></div>
  </section>

  <footer class="site-foot" data-i18n="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
